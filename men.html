<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEN | Lost American</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 20px;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin: 25px 20px;
      color: white;
      text-decoration: none;
    }

    h1 {
      text-align: center;
      margin-top: 50px;
      font-size: 40px;
    }

   .products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
  .product-card {
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 10px;
  overflow: hidden;
}

.product-photo {
  aspect-ratio: 4 / 5;
  background: #181818;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 12px;
  margin-bottom: 10px;
}

.product-card h3 {
  font-size: 14px;
  margin: 6px 0;
}

.product-card p {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 10px;
}

.product-card button {
  width: 100%;
  padding: 10px;
  border: none;
  background: white;
  color: black;
  font-weight: 800;
  cursor: pointer;
}
  </style>
</head>

<body>

  <header>
    <div class="logo">LOST AMERICAN</div>
  </header>

  <a class="back" href="index.html">← BACK</a>

 <div class="product-card" onclick="window.location.href='product.html'">

</div>
    <div class="product-card">

</html>
