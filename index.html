<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost American</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      max-width: 500px;
    }

    .button {
      margin-top: 25px;
      padding: 14px 28px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }

    .products {
      padding: 40px 20px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: #151515;
      padding: 15px;
      border-radius: 8px;
    }

    .product img {
      width: 100%;
      border-radius: 6px;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .price {
      color: #aaa;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 40px;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LOST AMERICAN</div>
  <div>SHOP</div>
</header>

<section class="hero">
  <h1>LOST AMERICAN</h1>
  <p>Streetwear for people who don't follow the crowd.</p>
  <a class="button" href="#shop">SHOP NOW</a>
</section>

<section class="products" id="shop">
  <h2>NEW DROP</h2>

  <div class="grid">

    <div class="product">
      <img src="https://placehold.co/600x700/111/FFF?text=LOST+AMERICAN" alt="T-Shirt">
      <h3>Lost American T-Shirt</h3>
      <div class="price">15 000 AMD</div>
    </div>

    <div class="product">
      <img src="https://placehold.co/600x700/111/FFF?text=LOST+AMERICAN" alt="Hoodie">
      <h3>Lost American Hoodie</h3>
      <div class="price">25 000 AMD</div>
    </div>

  </div>
</section>

<footer>
  © 2026 Lost American
</footer>

</body>
</html>
